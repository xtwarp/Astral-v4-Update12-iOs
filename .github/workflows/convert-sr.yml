name: Convert SR models (Nova, Quasar, Vega) to Core ML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "torch==2.5.1" "coremltools==8.3.0" safetensors

      - name: Write converter
        run: |
          cat > convert_sr.py <<'PYEOF'
          import json
          import os
          import shutil
          import sys
          import time
          import urllib.request

          import numpy as np
          import torch
          import torch.nn as nn
          import torch.nn.functional as F
          import coremltools as ct

          print("torch", torch.__version__, "| coremltools", ct.__version__, "| numpy", np.__version__)

          TILE = 522  # misma entrada fija que usan los demás modelos de la app (512 + 10 de pre-pad)

          MODELS = [
              {
                  "id": "hfa2k_compact",
                  "name": "2xHFA2kCompact",
                  "scale": 2,
                  "file": "2xHFA2kCompact.safetensors",
                  "urls": [
                      "https://huggingface.co/Phips/2xHFA2kCompact/resolve/main/2xHFA2kCompact.safetensors",
                  ],
                  "params": 600652,
              },
              {
                  "id": "animerd",
                  "name": "animerd v1",
                  "scale": 4,
                  "file": "4x-animerd-v1.pth",
                  "urls": [
                      "https://objectstorage.us-phoenix-1.oraclecloud.com/n/ax6ygfvpvzka/b/open-modeldb-files/o/4x-animerd-v1.pth",
                  ],
                  "params": None,
              },
              {
                  "id": "hfa2k_avc_compact",
                  "name": "2xHFA2kAVCCompact",
                  "scale": 2,
                  "file": "2xHFA2kAVCCompact.safetensors",
                  "urls": [
                      "https://huggingface.co/Phips/2xHFA2kAVCCompact/resolve/main/2xHFA2kAVCCompact.safetensors",
                      "https://github.com/Phhofm/models/releases/download/2xHFA2kAVCCompact/2xHFA2kAVCCompact.pth",
                      "https://huggingface.co/Phips/2xHFA2kAVCCompact/resolve/main/2xHFA2kAVCCompact.pth",
                  ],
                  "params": None,
              },
              {
                  "id": "lsdir_compact_c",
                  "name": "4xLSDIRCompactC",
                  "scale": 4,
                  "file": "4xLSDIRCompactC.safetensors",
                  "urls": [
                      "https://huggingface.co/Phips/4xLSDIRCompactC/resolve/main/4xLSDIRCompactC.safetensors",
                      "https://github.com/Phhofm/models/releases/download/4xLSDIRCompactC/4xLSDIRCompactC.pth",
                      "https://huggingface.co/Phips/4xLSDIRCompactC/resolve/main/4xLSDIRCompactC.pth",
                  ],
                  "params": None,
              },
          ]


          class SRVGGNetCompact(nn.Module):
              """Arquitectura Compact de Real-ESRGAN (la misma de AnimeVideo v3). Las claves coinciden con los pesos: body.N / upsampler."""

              def __init__(self, num_in_ch=3, num_out_ch=3, num_feat=64, num_conv=16, upscale=4, act_type="prelu"):
                  super().__init__()
                  self.upscale = upscale
                  self.body = nn.ModuleList()
                  self.body.append(nn.Conv2d(num_in_ch, num_feat, 3, 1, 1))
                  self.body.append(self._act(act_type, num_feat))
                  for _ in range(num_conv):
                      self.body.append(nn.Conv2d(num_feat, num_feat, 3, 1, 1))
                      self.body.append(self._act(act_type, num_feat))
                  self.body.append(nn.Conv2d(num_feat, num_out_ch * upscale * upscale, 3, 1, 1))
                  self.upsampler = nn.PixelShuffle(upscale)

              @staticmethod
              def _act(kind, num_feat):
                  if kind == "relu":
                      return nn.ReLU()
                  if kind == "leakyrelu":
                      return nn.LeakyReLU(0.1)
                  return nn.PReLU(num_parameters=num_feat)

              def forward(self, x):
                  out = x
                  for layer in self.body:
                      out = layer(out)
                  out = self.upsampler(out)
                  base = F.interpolate(x, scale_factor=self.upscale, mode="nearest")
                  return out + base


          class Wrapper(nn.Module):
              def __init__(self, net):
                  super().__init__()
                  self.net = net

              def forward(self, x):
                  return self.net(x).clamp(0.0, 1.0)


          def infer_arch(state):
              """Deduce num_feat, num_conv, upscale y activación a partir de las formas de los pesos (solo usa .shape y .ndim)."""
              conv_ids = sorted(
                  int(k.split(".")[1])
                  for k in state
                  if k.startswith("body.") and k.endswith(".weight") and state[k].ndim == 4
              )
              if len(conv_ids) < 3:
                  raise SystemExit("ERROR: no parece un modelo Compact (claves: %s)" % list(state)[:8])
              first, last = conv_ids[0], conv_ids[-1]
              num_in = state["body.%d.weight" % first].shape[1]
              num_feat = state["body.%d.weight" % first].shape[0]
              out_ch = state["body.%d.weight" % last].shape[0]
              num_conv = len(conv_ids) - 2
              upscale = int(round((out_ch / 3.0) ** 0.5))
              if 3 * upscale * upscale != out_ch or last != 2 * num_conv + 2:
                  raise SystemExit("ERROR: estructura inesperada (canales de salida %d, ultimo conv %d)" % (out_ch, last))
              has_prelu = any(k.startswith("body.") and k.endswith(".weight") and state[k].ndim == 1 for k in state)
              return {
                  "num_in_ch": num_in,
                  "num_out_ch": 3,
                  "num_feat": num_feat,
                  "num_conv": num_conv,
                  "upscale": upscale,
                  "act_type": "prelu" if has_prelu else "relu",
              }


          def download(urls, dest):
              """Prueba cada URL en orden. La extension del archivo guardado sale de la URL que funciono
              (.safetensors o .pth) y se devuelve la ruta final."""
              last_error = None
              for url in urls:
                  extension = ".safetensors" if url.lower().endswith(".safetensors") else ".pth"
                  target = os.path.splitext(dest)[0] + extension
                  for attempt in range(1, 4):
                      try:
                          print("Descargando %s (intento %d)" % (url, attempt))
                          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(request, timeout=120) as response, open(target, "wb") as handle:
                              shutil.copyfileobj(response, handle)
                          size = os.path.getsize(target)
                          print("  descargado: %d bytes" % size)
                          if size < 50000:
                              raise RuntimeError("archivo demasiado pequeno (%d bytes), probablemente no es el modelo" % size)
                          return target
                      except Exception as error:  # noqa: BLE001
                          last_error = error
                          print("  fallo:", error)
                          time.sleep(5 * attempt)
              raise SystemExit("ERROR: no se pudo descargar el modelo: %s" % last_error)


          def load_state(path):
              if path.endswith(".safetensors"):
                  from safetensors.torch import load_file

                  state = load_file(path)
              else:
                  state = torch.load(path, map_location="cpu", weights_only=True)
              for key in ("params_ema", "params", "state_dict", "model"):
                  if isinstance(state, dict) and key in state and isinstance(state[key], dict):
                      state = state[key]
                      break
              state = {(k[7:] if k.startswith("module.") else k): v for k, v in state.items()}
              return {k: v.float() for k, v in state.items() if hasattr(v, "float")}


          def make_test_image(size):
              rng = np.random.RandomState(1)
              yy, xx = np.mgrid[0:size, 0:size].astype(np.float32)
              img = np.zeros((size, size, 3), np.float32)
              for c in range(3):
                  for _ in range(8):
                      fx, fy = rng.uniform(0.002, 0.02, 2)
                      img[..., c] += np.sin(2 * np.pi * (fx * xx + fy * yy) + rng.uniform(0, 6.28))
              img = (img - img.min()) / (img.max() - img.min())
              for _ in range(30):  # bloques planos con bordes nitidos, como en dibujos
                  x0, y0 = rng.randint(0, size - 90, 2)
                  img[y0:y0 + rng.randint(20, 90), x0:x0 + rng.randint(20, 90)] = rng.uniform(0, 1, 3)
              return torch.from_numpy(np.ascontiguousarray(img.transpose(2, 0, 1)[None]))


          def main():
              os.makedirs("work", exist_ok=True)
              os.makedirs("out", exist_ok=True)
              summary = []
              for spec in MODELS:
                  print("\n========== %s (x%d) ==========" % (spec["name"], spec["scale"]))
                  path = download(spec["urls"], os.path.join("work", spec["file"]))
                  state = load_state(path)
                  arch = infer_arch(state)
                  print("arquitectura detectada:", arch)
                  if arch["upscale"] != spec["scale"]:
                      sys.exit("ERROR: el modelo es x%d pero se esperaba x%d" % (arch["upscale"], spec["scale"]))
                  net = SRVGGNetCompact(**arch).eval()
                  missing, unexpected = net.load_state_dict(state, strict=False)
                  print("claves que faltan:", missing)
                  print("claves sobrantes:", unexpected)
                  if missing or unexpected:
                      sys.exit("ERROR: los pesos no coinciden con la arquitectura.")
                  total = sum(p.numel() for p in net.parameters())
                  print("parametros:", total)
                  if spec["params"] and total != spec["params"]:
                      sys.exit("ERROR: se esperaban %d parametros y hay %d." % (spec["params"], total))

                  wrapper = Wrapper(net).eval()
                  image = make_test_image(TILE)
                  with torch.no_grad():
                      reference = wrapper(image).numpy()
                      nearest = F.interpolate(image, scale_factor=spec["scale"], mode="nearest").numpy()
                  expected_shape = (1, 3, TILE * spec["scale"], TILE * spec["scale"])
                  if reference.shape != expected_shape:
                      sys.exit("ERROR: forma de salida %s, se esperaba %s" % (reference.shape, expected_shape))

                  with torch.no_grad():
                      traced = torch.jit.trace(wrapper, torch.rand(1, 3, TILE, TILE), check_trace=False)
                  model = ct.convert(
                      traced,
                      inputs=[ct.TensorType(name="input", shape=(1, 3, TILE, TILE), dtype=np.float32)],
                      outputs=[ct.TensorType(name="output", dtype=np.float32)],
                      convert_to="mlprogram",
                      minimum_deployment_target=ct.target.iOS17,
                      compute_precision=ct.precision.FLOAT16,
                  )
                  model.short_description = "%s (x%d). Compact/SRVGGNet. Entrada RGB 0..1 [1,3,522,522]." % (spec["name"], spec["scale"])
                  stem = "RealESRGAN_%s_522_fp16" % spec["id"]
                  package = os.path.join("out", stem + ".mlpackage")
                  shutil.rmtree(package, ignore_errors=True)
                  model.save(package)

                  loaded = ct.models.MLModel(package, compute_units=ct.ComputeUnit.CPU_ONLY)
                  start = time.time()
                  result = np.array(loaded.predict({"input": image.numpy()})["output"])
                  seconds = time.time() - start
                  if result.shape != expected_shape:
                      sys.exit("ERROR: Core ML devolvio %s, se esperaba %s" % (result.shape, expected_shape))
                  if not np.isfinite(result).all():
                      sys.exit("ERROR: la salida de Core ML tiene NaN/inf.")
                  diff = np.abs(result - reference)
                  entry = {
                      "model": spec["name"],
                      "scale": spec["scale"],
                      "parameters": total,
                      "max_diff_vs_pytorch": float(diff.max()),
                      "mean_diff_vs_pytorch": float(diff.mean()),
                      "mean_diff_vs_nearest": float(np.abs(result - nearest).mean()),
                      "seconds_cpu_one_tile": round(seconds, 2),
                  }
                  print(json.dumps(entry, indent=2))
                  if entry["mean_diff_vs_pytorch"] > 0.02:
                      sys.exit("ERROR: Core ML no coincide con PyTorch (diferencia media %.4f)." % entry["mean_diff_vs_pytorch"])
                  shutil.make_archive(os.path.join("out", stem), "zip", root_dir="out", base_dir=os.path.basename(package))
                  summary.append(entry)

              with open("out/summary.json", "w") as handle:
                  json.dump(summary, handle, indent=2)
              print("\nRESUMEN:\n" + json.dumps(summary, indent=2))


          if __name__ == "__main__":
              main()
          PYEOF

      - name: Convert to Core ML (fp16) and verify
        run: |
          set -o pipefail
          mkdir -p out
          python convert_sr.py 2>&1 | tee out/conversion-log.txt

      - name: Publish models to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd out
          ls -lh

          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 6 ]; then
                echo "Falló tras $n intentos: $*"
                return 1
              fi
              echo "Intento $n falló (GitHub API intermitente). Reintentando en $((n * 15))s..."
              sleep $((n * 15))
              n=$((n + 1))
            done
          }

          gh release view sr-models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            retry gh release create sr-models --repo "$GITHUB_REPOSITORY" \
              --title "SR models Core ML (Nova, Quasar, Vega)" \
              --notes "Nova = 2xHFA2kCompact (Philip Hofmann, CC BY 4.0). Quasar = animerd v1 (musl, CC0-1.0). Vega x2 = 2xHFA2kAVCCompact y Vega x4 = 4xLSDIRCompactC (Philip Hofmann, CC BY 4.0). Convertidos a Core ML fp16." || exit 1

          for z in ./*.zip; do
            echo "Subiendo $z"
            retry gh release upload sr-models --repo "$GITHUB_REPOSITORY" --clobber "$z" || exit 1
          done
          echo "Todos los modelos publicados."
          gh release view sr-models --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Upload log and models as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr-coreml
          path: |
            out/conversion-log.txt
            out/summary.json
            out/*.zip
          if-no-files-found: warn
