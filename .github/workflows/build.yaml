name: Build Real-ESRGAN iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Xcode 26 (SDK de iOS 26) when available
        shell: bash
        run: |
          set -euo pipefail
          # Con Xcode 26 se activa el segundo plano de iOS 26; sin él la app compila igual y se pausa al salir, como antes.
          NEWEST="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc' | sort -V | tail -1 || true)"
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          else
            echo "AVISO: este runner no tiene Xcode 26; se compila sin la continuación en segundo plano de iOS 26."
          fi

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          swift --version
          xcodebuild -showsdks | grep -i "iOS 26" || echo "AVISO: no hay SDK de iOS 26 en este runner"

      - name: Locate Astral project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f project.yml ] && [ -d Astral ]; then
            PROJECT_ROOT="$PWD"
            echo "Proyecto en la raíz del repositorio"
          else
            echo "ZIPs encontrados:"
            find . -maxdepth 2 -type f -iname 'Astral*.zip' -print | sort
            ZIP="$(find . -maxdepth 2 -type f -iname 'Astral*.zip' | sort -V | tail -1)"

            if [ -z "$ZIP" ]; then
              echo "ERROR: no hay project.yml en la raíz ni ningún Astral*.zip"
              find . -maxdepth 3 -type f -not -path './.git/*' -print
              exit 1
            fi

            echo "Usando ZIP: $ZIP"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted

            PROJECT_YML="$(find extracted -type f -name project.yml -not -path '*/__MACOSX/*' | head -1)"
            if [ -z "$PROJECT_YML" ]; then
              echo "ERROR: el ZIP no contiene project.yml"
              find extracted -maxdepth 5 -type f -print
              exit 1
            fi
            PROJECT_ROOT="$PWD/$(dirname "$PROJECT_YML")"
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_ROOT"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Download Real-ESRGAN models
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x scripts_download_model.sh
          ./scripts_download_model.sh

      - name: Download extra upscaling models (Nova, Quasar)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          OUT="Astral/Resources"
          mkdir -p "$OUT" sr_tmp

          if ! gh release view sr-models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: no existe el release 'sr-models' en este repositorio."
            echo "Corre primero el workflow 'Convert SR models (Nova + Quasar) to Core ML' y luego este."
            exit 1
          fi

          # Solo los dos modelos que usa la app (Aurora ×2 y ×4): así un release con archivos de más no los mete en la app.
          gh release download sr-models --repo "$GITHUB_REPOSITORY" \
            --pattern 'RealESRGAN_hfa2k_compact_522_fp16.zip' \
            --pattern 'RealESRGAN_animerd_522_fp16.zip' \
            --dir sr_tmp --clobber

          for z in sr_tmp/*.zip; do
            unzip -oq "$z" -d "$OUT"
          done
          rm -rf sr_tmp

          for id in hfa2k_compact animerd; do
            if [ ! -d "$OUT/RealESRGAN_${id}_522_fp16.mlpackage" ]; then
              echo "ERROR: falta RealESRGAN_${id}_522_fp16.mlpackage en el release sr-models"
              exit 1
            fi
          done
          ls -d "$OUT"/RealESRGAN_*.mlpackage

      - name: Download General cleanup blends (optional)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$PROJECT_ROOT"
          OUT="Astral/Resources"
          mkdir -p "$OUT" sr_dn
          # Opcional: si el release sr-models aún no tiene las mezclas, la app se compila igual y el control de limpieza no se muestra.
          if gh release download sr-models --repo "$GITHUB_REPOSITORY" \
               --pattern 'RealESRGAN_general_dn*_522_fp16.zip' --dir sr_dn --clobber; then
            for z in sr_dn/*.zip; do
              unzip -oq "$z" -d "$OUT"
            done
            ls -d "$OUT"/RealESRGAN_general_dn*_522_fp16.mlpackage
          else
            echo "Aviso: el release sr-models no tiene las mezclas de limpieza del modelo General."
            echo "Corre 'Convert SR models' una vez para generarlas; mientras tanto la app no mostrará «Intensidad de limpieza»."
          fi
          rm -rf sr_dn

      - name: Download RIFE interpolation models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          OUT="Astral/Resources"
          mkdir -p "$OUT" rife_tmp/x

          if ! gh release view rife-models --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: no existe el release 'rife-models' en este repositorio."
            echo "Corre primero el workflow 'Convert RIFE 4.25 to Core ML' (tamaños 1920x1152,1152x1920) y luego este."
            exit 1
          fi

          gh release download rife-models --repo "$GITHUB_REPOSITORY" \
            --pattern 'RIFE_425_*.mlpackage.zip' --dir rife_tmp --clobber

          for z in rife_tmp/*.zip; do
            unzip -oq "$z" -d rife_tmp/x
          done

          MISSING=0
          for precision in fp16 fp32; do
            for pair in "1920x1152:Landscape" "1152x1920:Portrait"; do
              dims="${pair%%:*}"
              orientation="${pair##*:}"
              src="rife_tmp/x/RIFE_425_${precision}_${dims}.mlpackage"
              dst="$OUT/RIFE_${precision}_${orientation}.mlpackage"
              if [ -d "$src" ]; then
                rm -rf "$dst"
                mv "$src" "$dst"
                echo "RIFE listo: $precision $orientation"
              else
                echo "FALTA: RIFE_425_${precision}_${dims}.mlpackage en el release"
                MISSING=1
              fi
            done
          done
          rm -rf rife_tmp

          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: faltan modelos RIFE. Vuelve a correr 'Convert RIFE 4.25 to Core ML' con sizes = 1920x1152,1152x1920"
            exit 1
          fi
          ls -d "$OUT"/RIFE_*.mlpackage

      - name: Verify project and models
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          echo "===== project.yml ====="
          cat project.yml

          echo "===== Diagnóstico ====="
          echo "PROJECT_ROOT=$PWD"
          ls -la
          echo "--- Astral/ ---"
          ls -la Astral || true
          echo "--- Astral/Resources ---"
          ls -la Astral/Resources || true

          echo "===== Swift files ====="
          SWIFT_COUNT="$(find Astral -type f -name '*.swift' | wc -l | tr -d ' ')"
          find Astral -type f -name '*.swift' -print
          if [ "$SWIFT_COUNT" -eq 0 ]; then
            echo "ERROR: no hay archivos .swift dentro de Astral/ (¿se subió la carpeta Astral completa y se borró RealESRGANVideoUpscaler?)"
            exit 1
          fi

          echo "===== models ====="
          MISSING_MODELS=0
          for model in animevideo general anime_6B x4plus hfa2k_compact animerd; do
            if [ -d "Astral/Resources/RealESRGAN_${model}_522_fp16.mlpackage" ]; then
              echo "OK: $model"
            else
              echo "FALTA: RealESRGAN_${model}_522_fp16.mlpackage"
              MISSING_MODELS=1
            fi
          done
          if [ "$MISSING_MODELS" -ne 0 ]; then exit 1; fi

          echo "===== modelos RIFE ====="
          for precision in fp16 fp32; do
            for orientation in Landscape Portrait; do
              test -d "Astral/Resources/RIFE_${precision}_${orientation}.mlpackage"
            done
          done

          echo "===== iOS target ====="
          sed -i '' 's/iOS: "17.0"/iOS: "18.0"/g' project.yml || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET: 17.0/IPHONEOS_DEPLOYMENT_TARGET: 18.0/g' project.yml || true
          grep -n 'iOS:' project.yml || true
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' project.yml || true

      - name: Apply known Swift build fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          VP="$(find . -type f -name VideoProcessor.swift | head -1)"
          test -n "$VP"

          # CoreFoundation cast used by the current Swift/Xcode toolchain.
          sed -i '' \
            's/audioTrack\.formatDescriptions\.first as? CMFormatDescription/audioTrack.formatDescriptions.first as! CMFormatDescription/g' \
            "$VP" || true

          # UpscaleError.modelMissing exige un String: "throw UpscaleError.modelMissing"
          # sin argumento no compila (es una función, no un Error).
          RIFE="$(find . -type f -name RIFEInterpolator.swift | head -1)"
          if [ -n "$RIFE" ]; then
            sed -i '' \
              's/throw UpscaleError\.modelMissing }/throw UpscaleError.modelMissing("el modelo de interpolación RIFE") }/g' \
              "$RIFE"
            if grep -nE 'UpscaleError\.modelMissing([^(]|$)' "$RIFE"; then
              echo "ERROR: quedan usos de modelMissing sin argumento"
              exit 1
            fi
          fi

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          rm -rf Astral.xcodeproj
          xcodegen generate
          XCODEPROJ="$(find . -maxdepth 2 -type d -name '*.xcodeproj' | head -1)"
          test -n "$XCODEPROJ"
          echo "XCODEPROJ=$PWD/$XCODEPROJ" >> "$GITHUB_ENV"

      - name: Build Astral
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd "$PROJECT_ROOT"
          rm -rf build

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme Astral \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "################ ERRORES DE COMPILACIÓN (resumen) ################"
            grep -E 'error:|fatal error:|validator error:' build.log | sort -u | head -60
            {
              echo "### Errores de compilación"
              echo '```'
              grep -E 'error:|fatal error:|validator error:' build.log | sort -u | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "################################################################"
          fi
          exit "$STATUS"

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          cd "${PROJECT_ROOT:-.}" || true
          echo "===== ERRORS ====="
          if [ -f build.log ]; then
            grep -nE 'error:|fatal error:|validator error:' build.log | tail -100 || true
            echo "===== BUILD LOG TAIL ====="
            tail -150 build.log || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_ROOT }}/build.log
          if-no-files-found: ignore

      - name: Locate and verify Astral app
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          APP="$(find build -type d -name 'Astral.app' | head -1)"
          test -n "$APP"
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"

          for model in animevideo general anime_6B x4plus hfa2k_compact animerd; do
            test -d "$APP/RealESRGAN_${model}_522_fp16.mlmodelc"
          done
          ls -d "$APP"/RealESRGAN_general_dn*_522_fp16.mlmodelc 2>/dev/null \
            || echo "Aviso: la app no incluye las mezclas de limpieza del modelo General (el control no se mostrará)."

          echo "----- RIFE compilados dentro de la app -----"
          for precision in fp16 fp32; do
            for orientation in Landscape Portrait; do
              test -d "$APP/RIFE_${precision}_${orientation}.mlmodelc" \
                || { echo "ERROR: falta RIFE_${precision}_${orientation}.mlmodelc en la app"; exit 1; }
            done
          done
          find "$APP" -maxdepth 1 -iname 'RIFE_*.mlmodelc' -print

          echo "===== Info.plist de la app compilada ====="
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist" | head -60
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP/Info.plist" \
            || { echo "ERROR: falta UILaunchScreen: la app se vería en un recuadro"; exit 1; }

          echo "APP OK: $APP"

      - name: Create Astral IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          # El nombre sale de la versión de project.yml (CFBundleShortVersionString) y del número de ejecución.
          VERSION="$(awk -F'"' '/CFBundleShortVersionString/ {print $2; exit}' project.yml)"
          VERSION="${VERSION:-sin-version}"
          IPA_NAME="Astral-v${VERSION}-build${GITHUB_RUN_NUMBER}.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA_ARTIFACT=Astral-v${VERSION}-IPA" >> "$GITHUB_ENV"

          rm -rf artifact
          mkdir -p artifact/Payload
          cp -R "$APP" artifact/Payload/

          cd artifact
          zip -qry "$IPA_NAME" Payload
          test -s "$IPA_NAME"
          unzip -t "$IPA_NAME"
          ls -lh "$IPA_NAME"

      - name: Upload Astral IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_ARTIFACT }}
          path: ${{ env.PROJECT_ROOT }}/artifact/${{ env.IPA_NAME }}
          if-no-files-found: error
